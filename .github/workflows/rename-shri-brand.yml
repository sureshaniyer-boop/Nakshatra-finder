name: Rename Shri Ugra Mahalakshmy Branding

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/rename-shri-brand.yml'

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update branding across app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('mudakku.html'),
              Path('yogi-avayogi.html'),
              Path('nakshatra-details.html'),
              Path('manifest.webmanifest'),
              Path('manifest.json'),
          ]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('Ugra Mahalakshmy Astrology', 'Shri Ugra Mahalakshmy Astrology')
              text = text.replace('"short_name": "Ugra Mahalakshmy"', '"short_name": "Shri Ugra Mahalakshmy"')
              path.write_text(text, encoding='utf-8')

          sw = Path('service-worker.js')
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              import re
              text = re.sub(r'ugra-mahalakshmy-astrology-v\d+', 'shri-ugra-mahalakshmy-astrology-v12', text)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/rename-shri-brand.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rename app to Shri Ugra Mahalakshmy Astrology"
          git push
